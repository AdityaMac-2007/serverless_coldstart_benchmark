name: Serverless Benchmark Runner

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Benchmark Script
        run: python Google_ping.py

      - name: Commit and Push Updated CSVs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage new latency measurements first
          git add *latency_data.csv
          
          if git diff --staged --quiet; then
            echo "No new CSV updates to commit."
          else
            git commit -m "Auto-update benchmark datasets [skip ci]"
            
            # Pull any remote changes and rebase cleanly on top
            git pull --rebase origin main
            
            # Push the rebased data back to GitHub
            git push origin main
          fi

      # Triggers the next batch after a 35-minute post-batch cooldown
      - name: Trigger Next Batch
        env:
          GH_TOKEN: ${{ secrets.PAT_CHAIN }}
        run: |
          echo "Waiting 35 minutes to preserve scale-to-zero between batches..."
          sleep 5
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/benchmark.yml/dispatches \
            -d '{"ref":"main"}'